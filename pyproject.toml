[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Predictive maintenance on NASA C-MAPSS: RUL, warnings, anomalies, intervals and explanations, with an honest replay UI"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.11",
  "pydantic>=2.7",
  "pyyaml>=6",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "lightgbm>=4.3",
]

[project.optional-dependencies]
dl = ["torch>=2.2"]
explain = ["shap>=0.45"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8", "psutil>=5.9", "httpx>=0.27"]
all = ["sentinel[dl,explain,api,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["realdata: needs the official NASA files in data/raw/extracted"]
