[project]
name = "sentinel"
version = "0.1.0"
description = "Predictive maintenance on NASA C-MAPSS"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
  "pyyaml>=6",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3", "torch>=2.2", "shap>=0.45"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["realdata: needs the official NASA files in data/raw/extracted"]
